<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rocket Ball Arena</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;color:#fff;font-family:'Arial Black',Arial,sans-serif;user-select:none;-webkit-user-select:none}
body{touch-action:none;overscroll-behavior:none}
canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#scoreboard{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:24px;background:linear-gradient(180deg,rgba(0,0,20,0.88),rgba(0,0,20,0.65));backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.18);border-radius:40px;padding:10px 28px;box-shadow:0 8px 32px rgba(0,0,0,0.6),inset 0 1px 0 rgba(255,255,255,0.1)}
.team-score{font-size:38px;font-weight:900;min-width:42px;text-align:center}
#blueScore{color:#3aaeff;text-shadow:0 0 24px #3aaeff,0 0 8px #fff}
#orangeScore{color:#ff8a30;text-shadow:0 0 24px #ff8a30,0 0 8px #fff}
#timerEl{font-size:22px;min-width:66px;text-align:center;text-shadow:0 2px 8px #000;letter-spacing:1px}
#boostBar{position:absolute;bottom:230px;right:34px;width:24px;height:130px;background:rgba(0,0,0,0.55);border:2px solid #ff9500;border-radius:14px;overflow:hidden;box-shadow:0 0 25px rgba(255,149,0,0.55),inset 0 0 10px rgba(0,0,0,0.6)}
#boostFill{position:absolute;bottom:0;width:100%;background:linear-gradient(0deg,#ff3300,#ffe600);border-radius:10px;box-shadow:0 0 25px #ff9500;transition:height 0.08s}
#boostText{position:absolute;bottom:367px;right:24px;font-size:22px;font-weight:900;color:#ffe600;text-shadow:0 0 12px #ff9500;width:50px;text-align:center}
#joyBase{position:fixed;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.18) 0%,rgba(255,255,255,0.05) 70%);border:3px solid rgba(255,255,255,0.35);box-shadow:0 0 40px rgba(0,0,0,0.6),inset 0 0 30px rgba(255,255,255,0.08);display:none;pointer-events:none;z-index:8;transform:translate(-50%,-50%)}
#joyThumb{position:fixed;width:80px;height:80px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,0.85) 0%,rgba(255,255,255,0.3) 80%);border:3px solid #fff;box-shadow:0 0 25px rgba(255,255,255,0.7);display:none;pointer-events:none;z-index:9;transform:translate(-50%,-50%)}
.action-btn{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;pointer-events:all;text-shadow:0 2px 4px rgba(0,0,0,0.85);user-select:none;-webkit-user-select:none;touch-action:none}
.action-btn:active{transform:scale(0.92)}
#jumpBtn{width:82px;height:82px;right:132px;bottom:124px;background:radial-gradient(circle at 30% 30%,#5cc4ff,#1a5a99);border:3px solid #7fd4ff;box-shadow:0 0 30px rgba(58,174,255,0.7),inset 0 -4px 8px rgba(0,0,0,0.3);font-size:14px;letter-spacing:1px}
#boostBtn{width:108px;height:108px;right:24px;bottom:28px;background:radial-gradient(circle at 30% 30%,#ffcc33,#cc4400);border:3px solid #ffe066;box-shadow:0 0 40px rgba(255,149,0,0.85),inset 0 -4px 12px rgba(0,0,0,0.3);font-size:44px}
#camBtn{position:absolute;top:max(20px,env(safe-area-inset-top));right:18px;width:54px;height:54px;background:rgba(0,0,0,0.55);border:2px solid #3aaeff;border-radius:50%;font-size:22px;box-shadow:0 0 22px rgba(58,174,255,0.55)}
#goalAnnounce{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%) scale(0.3);font-size:96px;font-weight:900;pointer-events:none;text-shadow:0 0 60px currentColor,0 0 120px currentColor;z-index:50;letter-spacing:8px;opacity:0;transition:transform 0.5s cubic-bezier(0.34,1.56,0.64,1),opacity 0.4s;white-space:nowrap;font-family:'Arial Black',sans-serif}
#flash{position:fixed;inset:0;background:#fff;pointer-events:none;opacity:0;z-index:40;transition:opacity 0.35s;mix-blend-mode:screen}
#overlay{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,20,0.55) 0%,rgba(0,0,5,0.95) 80%);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;padding:24px;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#overlay h1{font-size:68px;letter-spacing:8px;background:linear-gradient(90deg,#3aaeff,#fff,#ff8a30,#fff,#3aaeff);background-size:300% auto;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;animation:grad 4s linear infinite;filter:drop-shadow(0 0 30px rgba(255,255,255,0.4))}
@keyframes grad{to{background-position:300% center}}
#overlay h2{font-size:16px;letter-spacing:14px;color:rgba(255,255,255,0.55);margin-bottom:34px}
.subtitle{font-size:15px;color:#ccc;margin-bottom:38px;text-align:center;line-height:2;max-width:400px}
.subtitle b{color:#fff;font-weight:900}
.subtitle .y{color:#ffe600}.subtitle .o{color:#ff8a30}.subtitle .b{color:#3aaeff}
.play-btn{padding:20px 72px;font-size:26px;font-weight:900;background:linear-gradient(135deg,#3aaeff,#0066cc);border:none;border-radius:50px;color:#fff;cursor:pointer;letter-spacing:4px;box-shadow:0 0 50px rgba(58,174,255,0.7),0 10px 30px rgba(0,0,0,0.6),inset 0 -4px 10px rgba(0,0,0,0.2);pointer-events:all}
.play-btn:active{transform:scale(0.96)}
#loader{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:300;color:#3aaeff;font-size:24px;letter-spacing:6px;font-weight:900}
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>
<div id="hud">
  <div id="scoreboard">
    <div class="team-score" id="blueScore">0</div>
    <div id="timerEl">5:00</div>
    <div class="team-score" id="orangeScore">0</div>
  </div>
  <div id="boostText">100</div>
  <div id="boostBar"><div id="boostFill" style="height:100%"></div></div>
  <div id="jumpBtn" class="action-btn">SALTO</div>
  <div id="boostBtn" class="action-btn">⚡</div>
  <div id="camBtn" class="action-btn">📹</div>
</div>
<div id="joyBase"></div>
<div id="joyThumb"></div>
<div id="flash"></div>
<div id="goalAnnounce"></div>
<div id="overlay">
  <h1>ROCKET BALL</h1>
  <h2>A R E N A</h2>
  <div class="subtitle">
    🕹️ <b>Joystick</b> en cualquier punto izquierdo<br>
    ⚡ <b>BOOST</b> · 🟦 <b>SALTO</b> (2x toques = volar)<br>
    Recoge <b class="y">pads amarillos</b>(12) y <b class="o">naranjas</b>(100)<br>
    🏃 <b>¡Conduce por las paredes y el techo!</b><br>
    📹 cambia entre cámara ball-cam y libre
  </div>
  <button class="play-btn" onclick="window.startMatch()">JUGAR</button>
</div>
<div id="loader">CARGANDO…</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050f);
scene.fog = new THREE.FogExp2(0x080820, 0.0032);

const camera = new THREE.PerspectiveCamera(62, 1, 0.1, 800);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1024, 1024), 0.85, 0.45, 0.55);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function onResize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h);
  composer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
onResize();
window.addEventListener('resize', onResize);

// CONSTANTS
const AW = 130, AH = 40, AL = 200;
const GW = 30, GH = 18;
const BR = 1.7;
const CW = 3.2, CH = 1.1, CL = 4.6;
const CAR_OFF = 0.7 + CH/2;
const GRAV = 32;

// AUDIO
let ac = null;
function initAudio(){ if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(ac&&ac.state==='suspended')ac.resume(); }
function tone(f,d,t,v,fe){if(!ac)return;const T=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.setValueAtTime(f,T);if(fe)o.frequency.exponentialRampToValueAtTime(Math.max(20,fe),T+d);g.gain.setValueAtTime(v,T);g.gain.exponentialRampToValueAtTime(0.0001,T+d);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+d);}
function noise(d,v){if(!ac)return;const s=ac.sampleRate,b=ac.createBuffer(1,Math.floor(s*d),s),dt=b.getChannelData(0);for(let i=0;i<dt.length;i++)dt[i]=(Math.random()*2-1)*(1-i/dt.length);const sr=ac.createBufferSource(),g=ac.createGain();sr.buffer=b;g.gain.value=v;sr.connect(g);g.connect(ac.destination);sr.start();}
function sndKick(i){tone(60+i*40,0.18,'sine',0.32*Math.min(1,i*0.6),30);noise(0.05,0.08*i);}
function sndJump(){tone(280,0.09,'square',0.07,620);}
function sndPickup(b){tone(b?420:720,0.13,'triangle',0.14,b?920:1320);}
function sndBoom(){noise(0.7,0.3);tone(190,0.7,'sawtooth',0.2,920);tone(140,0.7,'square',0.11,720);setTimeout(()=>tone(700,0.32,'square',0.13,990),250);}
function sndWallStick(){tone(180,0.2,'triangle',0.12,90);noise(0.08,0.06);}

// LIGHTS
const ambL = new THREE.AmbientLight(0x556688, 0.5);
const hemiL = new THREE.HemisphereLight(0x8899ff, 0x101020, 0.6);
const keyL = new THREE.DirectionalLight(0xccddff, 1.1);
keyL.position.set(70, 110, 50);
keyL.castShadow = true;
keyL.shadow.mapSize.set(2048, 2048);
Object.assign(keyL.shadow.camera, { near:1, far:350, left:-150, right:150, top:150, bottom:-150 });
keyL.shadow.bias = -0.0004;
const rimL = new THREE.DirectionalLight(0xff6699, 0.35);
rimL.position.set(-70, 50, -80);

// PARTICLES (pooled)
const PG = new THREE.SphereGeometry(1, 6, 5);
const particles = [], pool = [];
function pp(x,y,z,c,vx,vy,vz,sz,life,grav){
  let p = pool.pop();
  if(!p){p={mesh:new THREE.Mesh(PG,new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:1,depthWrite:false,blending:THREE.AdditiveBlending})),vel:new THREE.Vector3()};scene.add(p.mesh);}
  else{p.mesh.material.color.setHex(c);p.mesh.material.opacity=1;p.mesh.visible=true;}
  p.mesh.position.set(x,y,z);p.mesh.scale.setScalar(sz);p.vel.set(vx,vy,vz);p.life=life;p.ml=life;p.sz=sz;p.g=grav!==false;particles.push(p);
}
function updParts(dt){
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];p.life-=dt;
    if(p.life<=0){p.mesh.visible=false;particles.splice(i,1);pool.push(p);continue;}
    if(p.g)p.vel.y-=GRAV*dt*0.45;
    p.mesh.position.addScaledVector(p.vel,dt);
    const t=p.life/p.ml;p.mesh.material.opacity=t;p.mesh.scale.setScalar(p.sz*(0.4+t*0.65));
  }
}
function burst(x,y,z,c,n,pw){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI-Math.PI/3,s=pw*(0.4+Math.random()*0.9);
    pp(x,y,z,c,Math.cos(e)*Math.cos(a)*s,Math.sin(e)*s+pw*0.4,Math.cos(e)*Math.sin(a)*s,0.4+Math.random()*0.7,0.7+Math.random()*0.9,true);
  }
}

// TEXTURES (procedural)
function makeFieldTex(){
  const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,0,1024);g.addColorStop(0,'#0d5a18');g.addColorStop(0.5,'#0a4a14');g.addColorStop(1,'#0d5a18');
  x.fillStyle=g;x.fillRect(0,0,1024,1024);
  for(let i=0;i<16;i++){if(i%2===0){x.fillStyle='rgba(255,255,255,0.035)';x.fillRect(0,i*64,1024,64);}}
  x.strokeStyle='#fff';x.lineWidth=4;x.strokeRect(20,20,984,984);
  x.beginPath();x.moveTo(20,512);x.lineTo(1004,512);x.stroke();
  x.beginPath();x.arc(512,512,90,0,Math.PI*2);x.stroke();
  x.fillStyle='#fff';x.beginPath();x.arc(512,512,8,0,Math.PI*2);x.fill();
  for(const z of[80,944]){x.strokeRect(380,z-50,264,100);}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;
}
function makeBallTex(){
  const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');
  x.fillStyle='#ffffff';x.fillRect(0,0,512,512);
  x.fillStyle='#1a1a2a';x.strokeStyle='#444';x.lineWidth=3;
  function hex(cx,cy,r){x.beginPath();for(let i=0;i<6;i++){const a=i*Math.PI/3;const px=cx+r*Math.cos(a),py=cy+r*Math.sin(a);if(i===0)x.moveTo(px,py);else x.lineTo(px,py);}x.closePath();x.fill();x.stroke();}
  for(let yi=0;yi<10;yi++){for(let xi=0;xi<10;xi++){const ox=(yi%2)*30;hex(xi*60+30+ox,yi*52+26,18);}}
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}
function makeAdTex(text,bg,fg){
  const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
  x.fillStyle=bg;x.fillRect(0,0,512,128);
  x.fillStyle=fg;x.font='bold 72px Arial Black';x.textAlign='center';x.textBaseline='middle';x.fillText(text,256,64);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;
}

let fieldTex, ballTex;
const adTexs = [];

// WORLD
const worldObjects = [];
const boostPads = [];

function buildField(){
  const fm=new THREE.MeshStandardMaterial({map:fieldTex,roughness:0.85,metalness:0.05});
  const f=new THREE.Mesh(new THREE.PlaneGeometry(AW,AL,1,1),fm);
  f.rotation.x=-Math.PI/2;f.receiveShadow=true;
  scene.add(f);worldObjects.push(f);
  // Glowing edge strips
  const edgeMat=new THREE.MeshBasicMaterial({color:0x3aaeff,transparent:true,opacity:0.9});
  for(const z of[-AL/2+1,AL/2-1]){const e=new THREE.Mesh(new THREE.PlaneGeometry(AW,0.25),edgeMat);e.rotation.x=-Math.PI/2;e.position.set(0,0.05,z);scene.add(e);worldObjects.push(e);}
  const edgeMat2=new THREE.MeshBasicMaterial({color:0xff8a30,transparent:true,opacity:0.9});
  for(const x of[-AW/2+1,AW/2-1]){const e=new THREE.Mesh(new THREE.PlaneGeometry(0.25,AL),edgeMat2);e.rotation.x=-Math.PI/2;e.position.set(x,0.05,0);scene.add(e);worldObjects.push(e);}
}
function buildWalls(){
  // Side walls (semi-transparent with grid lines)
  const wallMat=new THREE.MeshStandardMaterial({color:0x1a2540,roughness:0.4,metalness:0.7,transparent:true,opacity:0.35,side:THREE.DoubleSide,envMapIntensity:0.6});
  for(const[x,ry]of[[-AW/2,0],[AW/2,Math.PI]]){
    const w=new THREE.Mesh(new THREE.PlaneGeometry(AL,AH),wallMat);
    w.position.set(x,AH/2,0);w.rotation.y=Math.PI/2+ry;
    scene.add(w);worldObjects.push(w);
  }
  // End walls (with goal holes — visual only, physics handled separately)
  for(const[z,sgn]of[[-AL/2,1],[AL/2,-1]]){
    const w=new THREE.Mesh(new THREE.PlaneGeometry(AW,AH),wallMat.clone());
    w.position.set(0,AH/2,z);w.rotation.y=sgn===1?0:Math.PI;
    scene.add(w);worldObjects.push(w);
  }
  // Wall ads (banners)
  for(let i=0;i<6;i++){
    const z=-AL/2+30+i*((AL-60)/5);
    const adMat=new THREE.MeshBasicMaterial({map:adTexs[i%adTexs.length],side:THREE.DoubleSide});
    for(const x of[-AW/2+0.2,AW/2-0.2]){
      const ad=new THREE.Mesh(new THREE.PlaneGeometry(20,5),adMat);
      ad.position.set(x,3,z);ad.rotation.y=x>0?-Math.PI/2:Math.PI/2;
      scene.add(ad);worldObjects.push(ad);
    }
  }
  // Corner glowing pillars
  const pMat=new THREE.MeshStandardMaterial({color:0x223355,metalness:0.9,roughness:0.15,emissive:0x4488ff,emissiveIntensity:0.7});
  for(const[x,z]of[[-AW/2,-AL/2],[AW/2,-AL/2],[-AW/2,AL/2],[AW/2,AL/2]]){
    const p=new THREE.Mesh(new THREE.CylinderGeometry(0.8,0.8,AH+3,16),pMat);
    p.position.set(x,AH/2,z);scene.add(p);worldObjects.push(p);
    // Top neon ring
    const r=new THREE.Mesh(new THREE.TorusGeometry(1.4,0.18,8,20),new THREE.MeshStandardMaterial({color:0x4488ff,emissive:0x4488ff,emissiveIntensity:2.5}));
    r.position.set(x,AH+0.5,z);r.rotation.x=Math.PI/2;scene.add(r);worldObjects.push(r);
  }
  // Ceiling (subtle dark with light points)
  const ceil=new THREE.Mesh(new THREE.PlaneGeometry(AW,AL),new THREE.MeshStandardMaterial({color:0x080820,roughness:0.6,side:THREE.BackSide,transparent:true,opacity:0.5}));
  ceil.rotation.x=Math.PI/2;ceil.position.y=AH;scene.add(ceil);worldObjects.push(ceil);
  // Ceiling light strips
  const stripMat=new THREE.MeshBasicMaterial({color:0xaaccff});
  for(let i=0;i<5;i++){
    const s=new THREE.Mesh(new THREE.PlaneGeometry(AW*0.85,0.6),stripMat);
    s.rotation.x=Math.PI/2;s.position.set(0,AH-0.05,-AL/2+30+i*((AL-60)/4));
    scene.add(s);worldObjects.push(s);
  }
}
function buildGoal(color,z,sgn){
  const postMat=new THREE.MeshStandardMaterial({color,emissive:color,emissiveIntensity:1.2,metalness:0.7,roughness:0.25});
  const netMat=new THREE.MeshStandardMaterial({color,transparent:true,opacity:0.45,side:THREE.DoubleSide,emissive:color,emissiveIntensity:0.7,depthWrite:false});
  const pr=0.45,depth=sgn*5.5;
  [-GW/2,GW/2].forEach(x=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,GH,16),postMat);p.position.set(x,GH/2,z);p.castShadow=true;scene.add(p);worldObjects.push(p);});
  const cb=new THREE.Mesh(new THREE.CylinderGeometry(pr,pr,GW+pr*2,16),postMat);cb.rotation.z=Math.PI/2;cb.position.set(0,GH,z);cb.castShadow=true;scene.add(cb);worldObjects.push(cb);
  const back=new THREE.Mesh(new THREE.PlaneGeometry(GW,GH),netMat);back.position.set(0,GH/2,z+depth);scene.add(back);worldObjects.push(back);
  [-GW/2,GW/2].forEach(x=>{const s=new THREE.Mesh(new THREE.PlaneGeometry(Math.abs(depth),GH),netMat);s.rotation.y=Math.PI/2;s.position.set(x,GH/2,z+depth/2);scene.add(s);worldObjects.push(s);});
  const top=new THREE.Mesh(new THREE.PlaneGeometry(GW,Math.abs(depth)),netMat);top.rotation.x=Math.PI/2;top.position.set(0,GH,z+depth/2);scene.add(top);worldObjects.push(top);
  const gl=new THREE.PointLight(color,3,40);gl.position.set(0,GH/2,z+depth/2);scene.add(gl);worldObjects.push(gl);
  const gl2=new THREE.PointLight(color,1.5,25);gl2.position.set(0,GH-2,z);scene.add(gl2);worldObjects.push(gl2);
  const line=new THREE.Mesh(new THREE.PlaneGeometry(GW,0.7),new THREE.MeshBasicMaterial({color,transparent:true,opacity:0.95}));
  line.rotation.x=-Math.PI/2;line.position.set(0,0.06,z);scene.add(line);worldObjects.push(line);
  // Bright tower lights on each side of goal
  for(const xs of[-GW/2-2,GW/2+2]){
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.8,GH+4,0.8),new THREE.MeshStandardMaterial({color:0x111122,emissive:color,emissiveIntensity:1.5}));
    t.position.set(xs,(GH+4)/2,z);scene.add(t);worldObjects.push(t);
  }
}
function buildStadium(){
  const t1=new THREE.MeshStandardMaterial({color:0x141430,roughness:0.85});
  const t2=new THREE.MeshStandardMaterial({color:0x222244,roughness:0.85});
  for(let tier=0;tier<6;tier++){

// SURFACES (for wall riding)
const SURF={
  floor:{up:new THREE.Vector3(0,1,0),ax:'y',tgt:CAR_OFF,sgn:1},
  ceiling:{up:new THREE.Vector3(0,-1,0),ax:'y',tgt:AH-CAR_OFF,sgn:-1},
  leftW:{up:new THREE.Vector3(1,0,0),ax:'x',tgt:-AW/2+CAR_OFF,sgn:1},
  rightW:{up:new THREE.Vector3(-1,0,0),ax:'x',tgt:AW/2-CAR_OFF,sgn:-1},
  backW:{up:new THREE.Vector3(0,0,1),ax:'z',tgt:-AL/2+CAR_OFF,sgn:1},
  frontW:{up:new THREE.Vector3(0,0,-1),ax:'z',tgt:AL/2-CAR_OFF,sgn:-1}
};

function snapToSurface(car,name,playSnd){
  const s=SURF[name];if(!s)return;
  const wasSurface=car.surface;
  car.surface=name;car.onGround=true;
  car.mesh.position[s.ax]=s.tgt;
  const dot=car.vel.dot(s.up);if(dot<0)car.vel.addScaledVector(s.up,-dot);
  // Align orientation: rotate so current local-Y aligns with surface up
  const curUp=new THREE.Vector3(0,1,0).applyQuaternion(car.quat);
  if(curUp.distanceToSquared(s.up)>0.001){
    const align=new THREE.Quaternion().setFromUnitVectors(curUp,s.up);
    car.quat.premultiply(align);
  }
  car.spinV.multiplyScalar(0.3);
  if(playSnd&&wasSurface!==name&&car.isPlayer&&name!=='floor')sndWallStick();
}
function leaveSurface(car){car.surface=null;car.onGround=false;}

function checkSurface(car){
  const p=car.mesh.position;
  if(car.surface){
    const s=SURF[car.surface];
    const offset=(p[s.ax]-s.tgt)*s.sgn;
    if(offset>1.6){leaveSurface(car);return;}
    p[s.ax]=s.tgt;
    const dot=car.vel.dot(s.up);if(dot<0)car.vel.addScaledVector(s.up,-dot);
    // Check if drove off edge
    let outOfBounds=false;
    if(car.surface==='leftW'||car.surface==='rightW'){if(p.y<1.5||p.y>AH-1.5||Math.abs(p.z)>AL/2-1.5)outOfBounds=true;}
    else if(car.surface==='backW'||car.surface==='frontW'){if(p.y<1.5||p.y>AH-1.5||Math.abs(p.x)>AW/2-1.5)outOfBounds=true;}
    else if(car.surface==='ceiling'){if(Math.abs(p.x)>AW/2-1.5||Math.abs(p.z)>AL/2-1.5)outOfBounds=true;}
    if(outOfBounds)leaveSurface(car);
  }else{
    // Airborne: check collisions
    if(p.y<=SURF.floor.tgt+0.1){snapToSurface(car,'floor',true);return;}
    if(p.y>=SURF.ceiling.tgt-0.1&&Math.abs(p.x)<AW/2-1&&Math.abs(p.z)<AL/2-1){snapToSurface(car,'ceiling',true);return;}
    if(p.x<=SURF.leftW.tgt+0.1&&Math.abs(p.z)<AL/2-1&&p.y<AH-1){snapToSurface(car,'leftW',true);return;}
    if(p.x>=SURF.rightW.tgt-0.1&&Math.abs(p.z)<AL/2-1&&p.y<AH-1){snapToSurface(car,'rightW',true);return;}
    if(p.z<=SURF.backW.tgt+0.1&&Math.abs(p.x)<AW/2-1&&p.y<AH-1){snapToSurface(car,'backW',true);return;}
    if(p.z>=SURF.frontW.tgt-0.1&&Math.abs(p.x)<AW/2-1&&p.y<AH-1){snapToSurface(car,'frontW',true);return;}
  }
}

function updCar(car,dt,thr,str,boost,jmp){
  const SPEED=24,BSPEED=42,TURN=2.5,ATURN=2.0,JUMP=15;
  const localY=new THREE.Vector3(0,1,0).applyQuaternion(car.quat);
  const localX=new THREE.Vector3(1,0,0).applyQuaternion(car.quat);
  // Steering / aerial
  if(car.onGround){
    const turnQ=new THREE.Quaternion().setFromAxisAngle(localY,-str*TURN*dt*(thr<-0.1?-1:1));
    car.quat.premultiply(turnQ);
  }else{
    // Air control: pitch + yaw
    const pitchQ=new THREE.Quaternion().setFromAxisAngle(localX,-thr*1.8*dt);
    car.quat.premultiply(pitchQ);
    const yawQ=new THREE.Quaternion().setFromAxisAngle(localY,-str*2.2*dt);
    car.quat.premultiply(yawQ);
  }
  // Spin (from explosions)
  if(car.spinV.lengthSq()>0.01){
    const ax=car.spinV.clone().normalize();
    const ang=car.spinV.length()*dt;
    const sQ=new THREE.Quaternion().setFromAxisAngle(ax,ang);
    car.quat.premultiply(sQ);
    car.spinV.multiplyScalar(0.96);
  }
  car.quat.normalize();
  // Recompute after rotations
  const fwd=new THREE.Vector3(0,0,1).applyQuaternion(car.quat);
  const up=new THREE.Vector3(0,1,0).applyQuaternion(car.quat);
  // Throttle
  const top=boost?BSPEED:SPEED;
  if(car.onGround){
    car.vel.addScaledVector(fwd,thr*top*dt*7);
    // Damp velocity in surface plane
    const upDot=car.vel.dot(up);
    const inP=car.vel.clone().sub(up.clone().multiplyScalar(upDot));
    const sp=inP.length();
    if(sp>top){inP.multiplyScalar(top/sp);}
    inP.multiplyScalar(0.88);
    car.vel.copy(inP).addScaledVector(up,upDot);
  }else{
    car.vel.addScaledVector(fwd,thr*12*dt);
  }
  // Boost upward thrust (in air, along car's up)
  if(boost&&!car.onGround){car.vel.addScaledVector(up,18*dt);}
  // Jump
  if(jmp&&car.jumpCD<=0){
    if(car.onGround){car.vel.addScaledVector(up,JUMP);car.surface=null;car.onGround=false;car.canDouble=true;car.jumpCD=0.25;if(car.isPlayer)sndJump();}
    else if(car.canDouble){car.vel.addScaledVector(up,JUMP*0.85);car.canDouble=false;car.jumpCD=1.0;if(car.isPlayer)sndJump();}
  }
  car.jumpCD=Math.max(0,car.jumpCD-dt);
  // Gravity
  if(car.onGround){
    // Mild force into surface to keep stuck
    car.vel.addScaledVector(up,-GRAV*dt*0.4);
  }else{
    car.vel.y-=GRAV*dt;
  }
  // Speed cap (overall)
  const allSp=car.vel.length();
  if(allSp>BSPEED*1.2)car.vel.multiplyScalar((BSPEED*1.2)/allSp);
  // Move
  car.mesh.position.addScaledVector(car.vel,dt);
  // Wall stick when on floor and crashing into wall
  if(car.surface==='floor'){
    const p=car.mesh.position,hSp=Math.hypot(car.vel.x,car.vel.z);
    if(hSp>8){
      if(p.x<SURF.leftW.tgt+1.8&&car.vel.x<-4)snapToSurface(car,'leftW',true);
      else if(p.x>SURF.rightW.tgt-1.8&&car.vel.x>4)snapToSurface(car,'rightW',true);
      else if(p.z<SURF.backW.tgt+1.8&&car.vel.z<-4)snapToSurface(car,'backW',true);
      else if(p.z>SURF.frontW.tgt-1.8&&car.vel.z>4)snapToSurface(car,'frontW',true);
    }
  }
  checkSurface(car);
  // Apply
  car.mesh.quaternion.copy(car.quat);
  // Wheel spin visual
  const wSp=car.vel.length();
  car.wheelMeshes.forEach(w=>w.rotation.x+=wSp*dt*2.5);
  // Boost flames
  if(boost&&car.boost>0.01){
    for(const ex of car.exhausts){
      const wp=new THREE.Vector3();ex.getWorldPosition(wp);
      for(let i=0;i<2;i++){
        const c=Math.random()<0.35?0xff2200:(Math.random()<0.55?0xff8800:0xffdd44);
        pp(wp.x+(Math.random()-0.5)*0.4,wp.y+(Math.random()-0.5)*0.3,wp.z+(Math.random()-0.5)*0.4,c,
          -fwd.x*(9+Math.random()*7)+(Math.random()-0.5)*2,-fwd.y*(9+Math.random()*7)+(Math.random()-0.5)*2-1,-fwd.z*(9+Math.random()*7)+(Math.random()-0.5)*2,
          c,0.5+Math.random()*0.4,0.35,false);
      }
    }
  }
  // Drift smoke
  if(car.onGround&&Math.abs(str)>0.7&&wSp>15){
    for(let i=0;i<2;i++){const wm=car.wheelMeshes[i+2];const wp=new THREE.Vector3();wm.getWorldPosition(wp);pp(wp.x,wp.y,wp.z,0xcccccc,(Math.random()-0.5)*3,Math.random()*2.5,(Math.random()-0.5)*3,0xcccccc,0.7,0.5,false);}
  }
}

function carBallCollision(car,b){
  if(!b.mesh.visible)return;
  const cp=car.mesh.position,bp=b.mesh.position;
  const dx=bp.x-cp.x,dy=bp.y-(cp.y),dz=bp.z-cp.z;
  const d=Math.sqrt(dx*dx+dy*dy+dz*dz),minD=BR+Math.max(CW,CL)*0.55;
  if(d<minD&&d>0.01){
    const nx=dx/d,ny=dy/d,nz=dz/d,o=minD-d;
    bp.x+=nx*o;bp.y+=ny*o;bp.z+=nz*o;
    const rvx=car.vel.x-b.vel.x,rvy=car.vel.y-b.vel.y,rvz=car.vel.z-b.vel.z;
    const dt2=rvx*nx+rvy*ny+rvz*nz;
    if(dt2>0){
      const imp=dt2*2.0;
      b.vel.x+=nx*imp;b.vel.y+=ny*imp+2.8;b.vel.z+=nz*imp;
      const sp=b.vel.length();if(sp>60)b.vel.multiplyScalar(60/sp);
      b.lastHitter=car;sndKick(Math.min(1,dt2/15));
      burst(bp.x-nx*BR,bp.y-ny*BR,bp.z-nz*BR,0xffffaa,10,6);
    }
  }
}

function checkPads(car,dt){
  const cp=car.mesh.position;
  for(const pad of boostPads){
    if(!pad.active){pad.respawnT-=dt;if(pad.respawnT<=0){pad.active=true;pad.mesh.visible=true;pad.disc.visible=true;pad.light.intensity=pad.big?1.5:0.7;}continue;}
    const ps=1+Math.sin(performance.now()*0.005+pad.x*0.1)*0.15;
    pad.mesh.scale.set(1,ps,1);pad.mesh.rotation.y+=dt*0.8;pad.disc.rotation.z+=dt*1.2;
    if(cp.y<4){
      const dx=cp.x-pad.x,dz=cp.z-pad.z,r=pad.big?3.5:2.1;
      if(dx*dx+dz*dz<r*r){
        pad.active=false;pad.mesh.visible=false;pad.disc.visible=false;pad.light.intensity=0;pad.respawnT=pad.big?10:4;
        car.boost=Math.min(1,car.boost+(pad.big?1.0:0.12));
        if(car.isPlayer)sndPickup(pad.big);
        burst(pad.x,0.5,pad.z,pad.color,22,8);
      }
    }
  }
}

// AI
function aiInput(car){
  const p=car.mesh.position,bp=ball.mesh.position,bv=ball.vel;
  const pr=bp.clone().addScaledVector(bv,0.4);
  const ownGoal=new THREE.Vector3(0,0,-AL/2);
  const dist=p.distanceTo(bp);
  let tgt;
  if(dist<20){const btG=ownGoal.clone().sub(bp).normalize();tgt=bp.clone().sub(btG.multiplyScalar(3.5));}
  else{tgt=pr;}
  const toT=tgt.clone().sub(p);toT.y=0;
  const tAng=Math.atan2(toT.x,toT.z);
  // Compute current AI heading from quaternion (approx, yaw only)
  const fw=new THREE.Vector3(0,0,1).applyQuaternion(car.quat);
  const curAng=Math.atan2(fw.x,fw.z);
  let diff=tAng-curAng;while(diff>Math.PI)diff-=Math.PI*2;while(diff<-Math.PI)diff+=Math.PI*2;
  const str=Math.max(-1,Math.min(1,diff*2.8));
  const boost=dist<30&&car.onGround&&Math.abs(diff)<0.5;
  const jmp=dist<7&&Math.abs(p.y-CAR_OFF)<1.6&&bp.y>2.5;
  car.boost=1.0;
  return{thr:1,str,boost,jmp};
}

// GAME STATE
let blueScore=0,orangeScore=0,gameTime=300,goalScored=false,goalTimer=0,camShake=0,ballCam=true;
let phase='menu',menuTime=0;
const input={joyX:0,joyY:0,boost:false,jumpPressed:false};
const camPos=new THREE.Vector3(0,25,-55),camLook=new THREE.Vector3(),camUp=new THREE.Vector3(0,1,0);

function initWorld(){
  scene.add(ambL);scene.add(hemiL);scene.add(keyL);scene.add(rimL);
  buildWorld();
  createBall();
  playerCar=createCar(0x3aaeff,true);
  aiCar=createCar(0xff8a30,false);
  ball.reset();playerCar.reset(-AL/3,0);aiCar.reset(AL/3,Math.PI);
}
function resetRound(){
  goalScored=false;goalTimer=0;camShake=0;
  ball.reset();playerCar.reset(-AL/3,0);aiCar.reset(AL/3,Math.PI);
}
function startMatch(){
  initAudio();
  document.getElementById('overlay').style.display='none';
  blueScore=0;orangeScore=0;gameTime=300;
  resetRound();
  phase='playing';
  updateScoreboard();
}
window.startMatch=startMatch;

function onGoal(scorer){
  if(goalScored)return;
  goalScored=true;goalTimer=4.5;camShake=2.5;
  phase='goal';
  const bp=ball.mesh.position.clone();
  const ec=scorer==='orange'?0x3aaeff:0xff8a30;
  // Massive explosion
  burst(bp.x,bp.y,bp.z,ec,140,32);
  burst(bp.x,bp.y,bp.z,0xffff00,80,26);
  burst(bp.x,bp.y,bp.z,0xffffff,50,20);
  for(let i=1;i<=4;i++){setTimeout(()=>{burst(bp.x+(Math.random()-0.5)*10,bp.y+Math.random()*5,bp.z+(Math.random()-0.5)*10,ec,60,18);burst(bp.x+(Math.random()-0.5)*10,bp.y+Math.random()*5,bp.z+(Math.random()-0.5)*10,0xffaa00,40,14);camShake=Math.max(camShake,1.6);},i*140);}
  // Blow cars away
  for(const car of[playerCar,aiCar]){
    const tc=car.mesh.position.clone().sub(bp);const d=Math.max(2,tc.length());
    tc.normalize();const force=Math.max(20,75-d*1.4);
    car.vel.x=tc.x*force;car.vel.y=tc.y*force+30;car.vel.z=tc.z*force;
    car.surface=null;car.onGround=false;
    car.spinV.set((Math.random()-0.5)*15,(Math.random()-0.5)*15,(Math.random()-0.5)*15);
  }
  ball.mesh.visible=false;ball.trail.forEach(t=>t.visible=false);
  if(scorer==='orange')blueScore++;else orangeScore++;
  showGoal(scorer==='orange'?'#3aaeff':'#ff8a30');
  flashScreen(ec);sndBoom();updateScoreboard();
}
function showGoal(c){const e=document.getElementById('goalAnnounce');e.textContent='¡GOOOL!';e.style.color=c;e.style.opacity='1';e.style.transform='translate(-50%,-50%) scale(1)';setTimeout(()=>{e.style.opacity='0';e.style.transform='translate(-50%,-50%) scale(0.3)';},2600);}
function flashScreen(c){const f=document.getElementById('flash');f.style.background='#'+c.toString(16).padStart(6,'0');f.style.opacity='0.85';setTimeout(()=>{f.style.opacity='0';},220);}
function updateScoreboard(){document.getElementById('blueScore').textContent=blueScore;document.getElementById('orangeScore').textContent=orangeScore;}
function updateTimer(dt){gameTime=Math.max(0,gameTime-dt);const m=Math.floor(gameTime/60),s=Math.floor(gameTime%60).toString().padStart(2,'0');document.getElementById('timerEl').textContent=m+':'+s;if(gameTime<=0)endGame();}
function endGame(){
  phase='menu';
  const w=blueScore>orangeScore?'¡VICTORIA! 🔵':blueScore<orangeScore?'DERROTA 🟠':'¡EMPATE!';
  const o=document.getElementById('overlay');
  o.innerHTML='<h1>FIN</h1><div class="subtitle" style="font-size:30px;color:#fff;margin-bottom:14px;font-weight:900">'+w+'</div><div class="subtitle" style="font-size:54px;font-weight:900;margin-bottom:26px"><span class="b">'+blueScore+'</span> - <span class="o">'+orangeScore+'</span></div><button class="play-btn" onclick="window.startMatch()">JUGAR DE NUEVO</button>';
  o.style.display='flex';
}
function updateCamera(dt){
  if(phase==='menu'){
    menuTime+=dt;
    const r=80;
    camera.position.set(Math.cos(menuTime*0.18)*r,28+Math.sin(menuTime*0.25)*8,Math.sin(menuTime*0.18)*r);
    camera.up.set(0,1,0);camera.lookAt(0,4,0);
    return;
  }
  if(!playerCar)return;
  const cp=playerCar.mesh.position,bp=ball.mesh.position;
  const carUp=new THREE.Vector3(0,1,0).applyQuaternion(playerCar.quat);
  let tx,ty,tz,lx,ly,lz;
  if(phase==='goal'){
    const ot=(4.5-goalTimer)*0.5;
    tx=bp.x+Math.sin(ot)*30;ty=16+Math.sin(ot*0.5)*5;tz=bp.z+Math.cos(ot)*30;
    lx=bp.x;ly=bp.y;lz=bp.z;
  }else{
    // Behind car (in surface plane)
    const fwd=new THREE.Vector3(0,0,1).applyQuaternion(playerCar.quat);
    let dx,dy,dz;
    if(ballCam){
      // Direction from ball to car projected to surface
      const toCar=new THREE.Vector3().subVectors(cp,bp);
      // Project onto surface plane
      const projDot=toCar.dot(carUp);
      toCar.addScaledVector(carUp,-projDot);
      const d=toCar.length();
      if(d<5){dx=-fwd.x;dy=-fwd.y;dz=-fwd.z;}
      else{toCar.normalize();dx=toCar.x;dy=toCar.y;dz=toCar.z;}
    }else{dx=-fwd.x;dy=-fwd.y;dz=-fwd.z;}
    const camDist=20,camHt=9;
    tx=cp.x+dx*camDist+carUp.x*camHt;
    ty=cp.y+dy*camDist+carUp.y*camHt;
    tz=cp.z+dz*camDist+carUp.z*camHt;
    lx=bp.x;ly=Math.max(bp.y+2,3);lz=bp.z;
    if(!ballCam){lx=cp.x+fwd.x*8;ly=cp.y+carUp.y*1.5;lz=cp.z+fwd.z*8;}
  }
  const lr=phase==='goal'?0.05:0.11;
  camPos.x+=(tx-camPos.x)*lr;camPos.y+=(ty-camPos.y)*lr;camPos.z+=(tz-camPos.z)*lr;
  camLook.x+=(lx-camLook.x)*0.15;camLook.y+=(ly-camLook.y)*0.15;camLook.z+=(lz-camLook.z)*0.15;
  camUp.lerp(phase==='goal'?new THREE.Vector3(0,1,0):carUp,0.08);camUp.normalize();
  camera.position.copy(camPos);
  if(camShake>0.01){camera.position.x+=(Math.random()-0.5)*camShake;camera.position.y+=(Math.random()-0.5)*camShake;camera.position.z+=(Math.random()-0.5)*camShake;camShake*=0.91;}
  camera.up.copy(camUp);
  camera.lookAt(camLook);
}

// CONTROLS (pointer events)
const joyBase=document.getElementById('joyBase'),joyThumb=document.getElementById('joyThumb');
const boostBtn=document.getElementById('boostBtn'),jumpBtn=document.getElementById('jumpBtn'),camBtn=document.getElementById('camBtn');
let joyPID=null,joyOX=0,joyOY=0;const JR=58;
function inRect(t,el){const r=el.getBoundingClientRect();return t.clientX>=r.left&&t.clientX<=r.right&&t.clientY>=r.top&&t.clientY<=r.bottom;}
function showJoy(x,y){joyBase.style.left=x+'px';joyBase.style.top=y+'px';joyThumb.style.left=x+'px';joyThumb.style.top=y+'px';joyBase.style.display='block';joyThumb.style.display='block';}
function moveJoyThumb(x,y){joyThumb.style.left=x+'px';joyThumb.style.top=y+'px';}
function hideJoy(){joyBase.style.display='none';joyThumb.style.display='none';}

document.addEventListener('pointerdown',e=>{
  if(e.pointerType==='mouse'&&e.button!==0)return;
  if(inRect(e,boostBtn)||inRect(e,jumpBtn)||inRect(e,camBtn))return;
  if(e.clientX>window.innerWidth*0.55)return;
  if(joyPID!==null)return;
  joyPID=e.pointerId;joyOX=e.clientX;joyOY=e.clientY;
  showJoy(e.clientX,e.clientY);
  e.preventDefault();
},{passive:false});
document.addEventListener('pointermove',e=>{
  if(e.pointerId!==joyPID)return;
  e.preventDefault();
  let dx=e.clientX-joyOX,dy=e.clientY-joyOY;
  const d=Math.sqrt(dx*dx+dy*dy);
  if(d>JR){dx=dx/d*JR;dy=dy/d*JR;}
  input.joyX=dx/JR;input.joyY=dy/JR;
  moveJoyThumb(joyOX+dx,joyOY+dy);
},{passive:false});
function joyEnd(e){if(e.pointerId!==joyPID)return;joyPID=null;input.joyX=0;input.joyY=0;hideJoy();}
document.addEventListener('pointerup',joyEnd);
document.addEventListener('pointercancel',joyEnd);

function setupBtn(el,onD,onU){
  el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId);}catch(_){}onD();},{passive:false});
  el.addEventListener('pointerup',e=>{e.preventDefault();onU();},{passive:false});
  el.addEventListener('pointercancel',e=>{e.preventDefault();onU();},{passive:false});
  el.addEventListener('pointerleave',e=>{onU();});
}
setupBtn(boostBtn,()=>{input.boost=true;},()=>{input.boost=false;});
setupBtn(jumpBtn,()=>{input.jumpPressed=true;},()=>{});
setupBtn(camBtn,()=>{toggleCam();},()=>{});

function toggleCam(){ballCam=!ballCam;camBtn.style.borderColor=ballCam?'#3aaeff':'rgba(255,255,255,0.4)';camBtn.style.boxShadow=ballCam?'0 0 22px rgba(58,174,255,0.55)':'none';}

const keys={};
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='Space'){input.jumpPressed=true;e.preventDefault();}if(e.code==='KeyC')toggleCam();});
window.addEventListener('keyup',e=>{keys[e.code]=false;});

// INIT TEXTURES & WORLD
fieldTex=makeFieldTex();
ballTex=makeBallTex();
adTexs.push(makeAdTex('ROCKET BALL','#000','#fff'));
adTexs.push(makeAdTex('TURBO','#ff8800','#fff'));
adTexs.push(makeAdTex('NITRO','#3aaeff','#fff'));
adTexs.push(makeAdTex('SPEED','#ff0066','#fff'));
adTexs.push(makeAdTex('GO!','#00ff66','#000'));
initWorld();
document.getElementById('loader').style.display='none';

// MAIN LOOP
let lastT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1000,0.05);lastT=now;
  if(phase==='playing'&&dt>0){
    let thr=0,str=0,boost=input.boost,jmp=input.jumpPressed;input.jumpPressed=false;
    if(Math.abs(input.joyX)>0.05||Math.abs(input.joyY)>0.05){thr=-input.joyY;str=input.joyX;}
    if(keys['ArrowUp']||keys['KeyW'])thr=1;if(keys['ArrowDown']||keys['KeyS'])thr=-0.5;
    if(keys['ArrowLeft']||keys['KeyA'])str=-1;if(keys['ArrowRight']||keys['KeyD'])str=1;
    if(keys['ShiftLeft'])boost=true;
    if(boost&&playerCar.boost>0){playerCar.boost=Math.max(0,playerCar.boost-dt*0.4);}else if(playerCar.boost<=0){boost=false;}
    const pct=Math.round(playerCar.boost*100);
    document.getElementById('boostFill').style.height=pct+'%';document.getElementById('boostText').textContent=pct;
    updCar(playerCar,dt,thr,str,boost,jmp);
    const ai=aiInput(aiCar);updCar(aiCar,dt,ai.thr,ai.str,ai.boost,ai.jmp);
    updBall(dt);
    carBallCollision(playerCar,ball);carBallCollision(aiCar,ball);
    checkPads(playerCar,dt);checkPads(aiCar,dt);
    updParts(dt);updateTimer(dt);
  }else if(phase==='goal'&&dt>0){
    goalTimer-=dt;
    // Cars keep tumbling
    updCar(playerCar,dt,0,0,false,false);
    updCar(aiCar,dt,0,0,false,false);
    updParts(dt);
    if(goalTimer<=0){ball.mesh.visible=true;resetRound();phase='playing';}
  }else{updParts(dt);}
  updateCamera(dt);
  composer.render();
}
requestAnimationFrame(loop);
</script>
