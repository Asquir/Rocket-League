<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rocket Ball Arena</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { width:100%; height:100%; overflow:hidden; }
body { background:#000; touch-action:none; font-family:'Arial Black',Arial,sans-serif; user-select:none; -webkit-user-select:none; color:#fff; }
canvas { display:block; }

#hud { position:fixed; inset:0; pointer-events:none; }

#scoreboard {
  position:absolute; top:max(12px, env(safe-area-inset-top)); left:50%;
  transform:translateX(-50%);
  display:flex; align-items:center; gap:24px;
  background:linear-gradient(180deg, rgba(0,0,20,0.85), rgba(0,0,20,0.65));
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:40px; padding:10px 28px;
  box-shadow:0 8px 32px rgba(0,0,0,0.5);
}
.team-score { font-size:36px; font-weight:900; min-width:38px; text-align:center; }
#blueScore { color:#3aaeff; text-shadow:0 0 20px #3aaeff, 0 0 6px #fff; }
#orangeScore { color:#ff8a30; text-shadow:0 0 20px #ff8a30, 0 0 6px #fff; }
#timerEl { font-size:22px; font-weight:900; min-width:65px; text-align:center; text-shadow:0 2px 8px #000; letter-spacing:1px; }

#boostBar {
  position:absolute; bottom:220px; right:32px;
  width:22px; height:120px;
  background:rgba(0,0,0,0.55);
  border:2px solid #ff9500;
  border-radius:12px; overflow:hidden;
  box-shadow:0 0 20px rgba(255,149,0,0.5), inset 0 0 10px rgba(0,0,0,0.5);
}
#boostFill { position:absolute; bottom:0; width:100%; background:linear-gradient(0deg,#ff5500,#ffe600); border-radius:8px; box-shadow:0 0 20px #ff9500; transition:height 0.08s; }
#boostText { position:absolute; bottom:345px; right:18px; font-size:20px; font-weight:900; color:#ffe600; text-shadow:0 0 10px #ff9500; width:50px; text-align:center; }

#joystickZone { position:absolute; left:20px; bottom:20px; width:170px; height:170px; pointer-events:all; }
#joystickBase {
  width:170px; height:170px; border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.12), rgba(255,255,255,0.04));
  border:3px solid rgba(255,255,255,0.3);
  box-shadow:0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
}
#joystickThumb {
  position:absolute; width:70px; height:70px; top:50px; left:50px;
  border-radius:50%;
  background:radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0.3));
  border:2px solid #fff;
  box-shadow:0 0 20px rgba(255,255,255,0.6);
}
.action-btn {
  position:absolute; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  font-weight:900; color:#fff; pointer-events:all;
  text-shadow:0 2px 4px rgba(0,0,0,0.8);
  transition:transform 0.05s;
}
.action-btn:active { transform:scale(0.92); }
#jumpBtn {
  width:75px; height:75px;
  right:120px; bottom:120px;
  background:radial-gradient(circle, #3aaeff, #1a5a99);
  border:3px solid #5cc4ff;
  box-shadow:0 0 25px rgba(58,174,255,0.6);
  font-size:13px;
}
#boostBtn {
  width:100px; height:100px;
  right:24px; bottom:30px;
  background:radial-gradient(circle, #ff9500, #cc4400);
  border:3px solid #ffcc33;
  box-shadow:0 0 30px rgba(255,149,0,0.8);
  font-size:38px;
}
#camBtn {
  position:absolute; top:max(18px, env(safe-area-inset-top)); right:18px;
  width:48px; height:48px;
  background:rgba(0,0,0,0.55);
  border:2px solid rgba(58,174,255,0.6);
  border-radius:50%;
  font-size:20px;
}

#goalAnnounce {
  position:fixed; top:38%; left:50%;
  transform:translate(-50%, -50%) scale(0.4);
  font-size:84px; font-weight:900;
  pointer-events:none;
  text-shadow:0 0 40px currentColor, 0 0 80px currentColor;
  z-index:50;
  letter-spacing:6px;
  opacity:0;
  transition:transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s;
  white-space:nowrap;
}

#flash {
  position:fixed; inset:0;
  background:#fff;
  pointer-events:none;
  opacity:0;
  z-index:40;
  transition:opacity 0.35s;
  mix-blend-mode:screen;
}

#overlay {
  position:fixed; inset:0;
  background:radial-gradient(circle at center, rgba(20,10,40,0.95), rgba(0,0,10,0.99));
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  z-index:200; padding:24px;
}
#overlay h1 {
  font-size:60px; letter-spacing:6px;
  background:linear-gradient(90deg,#3aaeff,#fff,#ff8a30,#fff,#3aaeff);
  background-size:300% auto;
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
  margin-bottom:6px;
  animation:gradient 4s linear infinite;
  text-shadow:0 0 80px rgba(255,255,255,0.4);
}
@keyframes gradient { to { background-position:300% center; } }
#overlay h2 {
  font-size:16px; letter-spacing:10px;
  color:rgba(255,255,255,0.5); margin-bottom:34px;
}
.subtitle {
  font-size:15px; color:#bbb;
  margin-bottom:36px; text-align:center; line-height:1.9;
  max-width:380px;
}
.subtitle b { color:#fff; font-weight:900; }
.subtitle .y { color:#ffe600; }
.subtitle .o { color:#ff8a30; }
.subtitle .b { color:#3aaeff; }
.play-btn {
  padding:18px 64px; font-size:24px; font-weight:900;
  background:linear-gradient(135deg,#3aaeff,#0066cc);
  border:none; border-radius:50px; color:#fff;
  cursor:pointer; letter-spacing:3px;
  box-shadow:0 0 40px rgba(58,174,255,0.6), 0 8px 24px rgba(0,0,0,0.5);
  pointer-events:all;
}
.play-btn:active { transform:scale(0.96); }
</style>
</head>
<body>
<canvas id="gameCanvas"></canvas>

<div id="hud">
  <div id="scoreboard">
    <div class="team-score" id="blueScore">0</div>
    <div id="timerEl">5:00</div>
    <div class="team-score" id="orangeScore">0</div>
  </div>
  <div id="boostText">100</div>
  <div id="boostBar"><div id="boostFill" style="height:100%"></div></div>
  <div id="joystickZone">
    <div id="joystickBase"></div>
    <div id="joystickThumb"></div>
  </div>
  <div id="jumpBtn" class="action-btn">SALTO</div>
  <div id="boostBtn" class="action-btn">⚡</div>
  <div id="camBtn" class="action-btn">📹</div>
</div>

<div id="flash"></div>
<div id="goalAnnounce"></div>

<div id="overlay">
  <h1>ROCKET BALL</h1>
  <h2>A R E N A</h2>
  <div class="subtitle">
    🕹️ <b>Joystick</b> · mover y girar<br>
    ⚡ <b>BOOST</b> · acelerar y volar<br>
    🟦 <b>SALTO</b> · doble toque para volar<br>
    Recoge los <b class="y">discos amarillos</b> (12) y <b class="o">naranjas</b> (100) para recargar nitro<br>
    📹 toca el botón cámara para cambiar de vista
  </div>
  <button class="play-btn" onclick="startGame()">JUGAR</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
'use strict';

// ===========================================================
// ROCKET BALL ARENA — 3D mobile Rocket League-style game
// ===========================================================

const canvas = document.getElementById('gameCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05050f);
scene.fog = new THREE.FogExp2(0x0a0a25, 0.0035);

const camera = new THREE.PerspectiveCamera(65, 1, 0.1, 600);

// ===========================================================
// CONSTANTS — BIG ARENA
// ===========================================================
const AW = 120, AH = 36, AL = 180;
const GW = 26, GH = 16;
const BR = 1.6;
const CW = 3.0, CH = 1.1, CL = 4.4;
const GRAVITY = -28;
const ELASTICITY = 0.66;

function onResize() {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
}
onResize();
window.addEventListener('resize', onResize);

// ===========================================================
// AUDIO (Web Audio synth)
// ===========================================================
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function tone(freq, dur, type, vol, freqEnd) {
  if (!audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(Math.max(20, freqEnd), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur);
}
function noise(dur, vol) {
  if (!audioCtx) return;
  const sr = audioCtx.sampleRate;
  const buf = audioCtx.createBuffer(1, Math.floor(sr * dur), sr);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
  const s = audioCtx.createBufferSource();
  const g = audioCtx.createGain();
  s.buffer = buf; g.gain.value = vol;
  s.connect(g); g.connect(audioCtx.destination);
  s.start();
}
function sndKick(i) { tone(60 + i*40, 0.16, 'sine', 0.3 * Math.min(1, i*0.6), 30); noise(0.05, 0.08 * i); }
function sndJump() { tone(280, 0.09, 'square', 0.07, 600); }
function sndPickup(big) { tone(big ? 400 : 700, 0.12, 'triangle', 0.13, big ? 900 : 1300); }
function sndGoal() {
  noise(0.6, 0.25);
  tone(180, 0.7, 'sawtooth', 0.18, 900);
  tone(140, 0.7, 'square', 0.1, 700);
  setTimeout(() => tone(660, 0.3, 'square', 0.12, 990), 250);
}

// ===========================================================
// SCENE LIGHTS (added once)
// ===========================================================
const ambLight = new THREE.AmbientLight(0x556688, 0.55);
const keyLight = new THREE.DirectionalLight(0xbbccff, 0.9);
keyLight.position.set(60, 90, 40);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(2048, 2048);
Object.assign(keyLight.shadow.camera, { near:1, far:300, left:-130, right:130, top:130, bottom:-130 });
keyLight.shadow.bias = -0.0005;

const rimLight = new THREE.DirectionalLight(0xff66aa, 0.25);
rimLight.position.set(-60, 40, -60);

// ===========================================================
// PARTICLES (pooled spheres)
// ===========================================================
const particles = [];
const particlePool = [];
const PARTICLE_GEO = new THREE.SphereGeometry(1, 6, 5);

function spawnParticle(x, y, z, color, vx, vy, vz, size, life, gravity) {
  let p = particlePool.pop();
  if (!p) {
    p = {
      mesh: new THREE.Mesh(PARTICLE_GEO, new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 1, depthWrite: false })),
      vel: new THREE.Vector3()
    };
    scene.add(p.mesh);
  } else {
    p.mesh.material.color.setHex(color);
    p.mesh.material.opacity = 1;
    p.mesh.visible = true;
  }
  p.mesh.position.set(x, y, z);
  p.mesh.scale.setScalar(size);
  p.vel.set(vx, vy, vz);
  p.life = life; p.maxLife = life; p.size = size;
  p.gravity = gravity !== false;
  particles.push(p);
}

function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt;
    if (p.life <= 0) {
      p.mesh.visible = false;
      particles.splice(i, 1);
      particlePool.push(p);
      continue;
    }
    if (p.gravity) p.vel.y += GRAVITY * dt * 0.4;
    p.mesh.position.addScaledVector(p.vel, dt);
    const t = p.life / p.maxLife;
    p.mesh.material.opacity = t;
    p.mesh.scale.setScalar(p.size * (0.4 + t*0.6));
  }
}

function burst(x, y, z, color, count, power) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI*2;
    const e = Math.random() * Math.PI - Math.PI/3;
    const s = power * (0.4 + Math.random()*0.9);
    spawnParticle(x, y, z, color,
      Math.cos(e)*Math.cos(a)*s,
      Math.sin(e)*s + power*0.4,
      Math.cos(e)*Math.sin(a)*s,
      0.4 + Math.random()*0.7, 0.7 + Math.random()*0.9, true);
  }
}

// ===========================================================
// WORLD
// ===========================================================
const worldObjects = [];
const boostPads = [];

function buildField() {
  // Base grass
  const fieldMat = new THREE.MeshStandardMaterial({ color: 0x0a4a18, roughness: 0.85, metalness: 0.05 });
  const field = new THREE.Mesh(new THREE.PlaneGeometry(AW, AL), fieldMat);
  field.rotation.x = -Math.PI/2;
  field.receiveShadow = true;
  scene.add(field); worldObjects.push(field);

  // Alternating stripes
  const stripeMat = new THREE.MeshStandardMaterial({ color: 0x0d5a1f, roughness: 0.85, metalness: 0.05 });
  for (let i = 0; i < 10; i++) {
    if (i % 2 === 0) continue;
    const s = new THREE.Mesh(new THREE.PlaneGeometry(AW, AL/10), stripeMat);
    s.rotation.x = -Math.PI/2;
    s.position.set(0, 0.01, -AL/2 + i*AL/10 + AL/20);
    s.receiveShadow = true;
    scene.add(s); worldObjects.push(s);
  }

  const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  function line(w, l, x, z) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, l), lineMat);
    m.rotation.x = -Math.PI/2;
    m.position.set(x, 0.04, z);
    scene.add(m); worldObjects.push(m);
  }

  line(AW - 4, 0.4, 0, -AL/2 + 2.5);
  line(AW - 4, 0.4, 0, AL/2 - 2.5);
  line(0.4, AL - 5, -AW/2 + 2.5, 0);
  line(0.4, AL - 5, AW/2 - 2.5, 0);
  line(AW - 4, 0.4, 0, 0);

  // Center circle
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(9, 9.6, 60),
    new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI/2;
  ring.position.y = 0.04;
  scene.add(ring); worldObjects.push(ring);

  const dot = new THREE.Mesh(new THREE.CircleGeometry(0.7, 16), lineMat);
  dot.rotation.x = -Math.PI/2;
  dot.position.y = 0.04;
  scene.add(dot); worldObjects.push(dot);

  // Penalty boxes
  for (const z of [-AL/2 + 22, AL/2 - 22]) {
    const bw = GW + 18, bh = 22;
    line(bw, 0.4, 0, z);
    line(0.4, bh, -bw/2, z + (z < 0 ? bh/2 : -bh/2));
    line(0.4, bh, bw/2, z + (z < 0 ? bh/2 : -bh/2));
  }
}

function buildWalls() {
  const wallMat = new THREE.MeshStandardMaterial({
    color: 0x1f3a5a, roughness: 0.5, metalness: 0.55,
    transparent: true, opacity: 0.45, side: THREE.DoubleSide
  });
  [[-AW/2, 0], [AW/2, Math.PI]].forEach(([x, ry]) => {
    const w = new THREE.Mesh(new THREE.PlaneGeometry(AL, AH), wallMat);
    w.position.set(x, AH/2, 0);
    w.rotation.y = Math.PI/2 + ry;
    scene.add(w); worldObjects.push(w);
  });

  // Corner pillars (glowing)
  const pillarMat = new THREE.MeshStandardMaterial({
    color: 0x223355, metalness: 0.85, roughness: 0.2,
    emissive: 0x4488ff, emissiveIntensity: 0.5
  });
  for (const [x, z] of [[-AW/2, -AL/2], [AW/2, -AL/2], [-AW/2, AL/2], [AW/2, AL/2]]) {
    const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, AH + 2, 14), pillarMat);
    pillar.position.set(x, AH/2, z);
    scene.add(pillar); worldObjects.push(pillar);
  }

  // Ceiling (very subtle)
  const ceilMat = new THREE.MeshStandardMaterial({
    color: 0x080820, transparent: true, opacity: 0.15, side: THREE.BackSide
  });
  const ceil = new THREE.Mesh(new THREE.PlaneGeometry(AW, AL), ceilMat);
  ceil.rotation.x = Math.PI/2;
  ceil.position.y = AH;
  scene.add(ceil); worldObjects.push(ceil);
}

function buildGoal(color, z, side) {
  const postMat = new THREE.MeshStandardMaterial({
    color, emissive: color, emissiveIntensity: 0.9,
    metalness: 0.6, roughness: 0.35
  });
  const netMat = new THREE.MeshStandardMaterial({
    color, transparent: true, opacity: 0.4, side: THREE.DoubleSide,
    emissive: color, emissiveIntensity: 0.55, depthWrite: false
  });
  const pr = 0.4;
  const depth = side * 5;

  [-GW/2, GW/2].forEach(x => {
    const post = new THREE.Mesh(new THREE.CylinderGeometry(pr, pr, GH, 14), postMat);
    post.position.set(x, GH/2, z);
    post.castShadow = true;
    scene.add(post); worldObjects.push(post);
  });

  const cross = new THREE.Mesh(new THREE.CylinderGeometry(pr, pr, GW + pr*2, 14), postMat);
  cross.rotation.z = Math.PI/2;
  cross.position.set(0, GH, z);
  cross.castShadow = true;
  scene.add(cross); worldObjects.push(cross);

  const back = new THREE.Mesh(new THREE.PlaneGeometry(GW, GH), netMat);
  back.position.set(0, GH/2, z + depth);
  scene.add(back); worldObjects.push(back);

  [-GW/2, GW/2].forEach(x => {
    const sideNet = new THREE.Mesh(new THREE.PlaneGeometry(Math.abs(depth), GH), netMat);
    sideNet.rotation.y = Math.PI/2;
    sideNet.position.set(x, GH/2, z + depth/2);
    scene.add(sideNet); worldObjects.push(sideNet);
  });

  const top = new THREE.Mesh(new THREE.PlaneGeometry(GW, Math.abs(depth)), netMat);
  top.rotation.x = Math.PI/2;
  top.position.set(0, GH, z + depth/2);
  scene.add(top); worldObjects.push(top);

  // Goal glow lights
  const gl1 = new THREE.PointLight(color, 2.2, 35);
  gl1.position.set(0, GH/2, z + depth/2);
  scene.add(gl1); worldObjects.push(gl1);

  const gl2 = new THREE.PointLight(color, 1.0, 20);
  gl2.position.set(0, GH - 2, z);
  scene.add(gl2); worldObjects.push(gl2);

  // Bright goal line
  const goalLine = new THREE.Mesh(
    new THREE.PlaneGeometry(GW, 0.6),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85 })
  );
  goalLine.rotation.x = -Math.PI/2;
  goalLine.position.set(0, 0.06, z);
  scene.add(goalLine); worldObjects.push(goalLine);
}

function buildStadium() {
  // Seating tiers around the arena
  const tierMatA = new THREE.MeshStandardMaterial({ color: 0x1a1a30, roughness: 0.9 });
  const tierMatB = new THREE.MeshStandardMaterial({ color: 0x2a2a4a, roughness: 0.9 });
  for (let tier = 0; tier < 5; tier++) {
    const tierY = AH + 1 + tier*2.6;
    const tierW = AW + 22 + tier*6;
    const tierL = AL + 22 + tier*6;
    for (const xSign of [-1, 1]) {
      const seat = new THREE.Mesh(new THREE.BoxGeometry(2, 2.2, tierL), tier % 2 ? tierMatA : tierMatB);
      seat.position.set(xSign * tierW/2, tierY, 0);
      scene.add(seat); worldObjects.push(seat);
    }
    for (const zSign of [-1, 1]) {
      const seat = new THREE.Mesh(new THREE.BoxGeometry(tierW, 2.2, 2), tier % 2 ? tierMatA : tierMatB);
      seat.position.set(0, tierY, zSign * tierL/2);
      scene.add(seat); worldObjects.push(seat);
    }
  }

  // Crowd — instanced colorful cubes
  const crowdGeo = new THREE.BoxGeometry(0.55, 0.85, 0.55);
  const crowdCount = 1100;
  const crowdMat = new THREE.MeshLambertMaterial({ vertexColors: true });
  const crowdMesh = new THREE.InstancedMesh(crowdGeo, crowdMat, crowdCount);
  const dummy = new THREE.Object3D();
  const colors = new Float32Array(crowdCount * 3);
  const color = new THREE.Color();
  for (let i = 0; i < crowdCount; i++) {
    const sideIdx = Math.floor(Math.random() * 4);
    const tier = Math.floor(Math.random() * 5);
    const tierY = AH + 1 + tier*2.6 + 1.6;
    const tierW = AW + 22 + tier*6;
    const tierL = AL + 22 + tier*6;
    let x, z;
    if (sideIdx === 0) { x = -tierW/2 - 1; z = (Math.random()-0.5) * tierL; }
    else if (sideIdx === 1) { x = tierW/2 + 1; z = (Math.random()-0.5) * tierL; }
    else if (sideIdx === 2) { x = (Math.random()-0.5) * tierW; z = -tierL/2 - 1; }
    else { x = (Math.random()-0.5) * tierW; z = tierL/2 + 1; }
    dummy.position.set(x, tierY, z);
    dummy.rotation.y = (Math.random() - 0.5) * 0.6;
    dummy.updateMatrix();
    crowdMesh.setMatrixAt(i, dummy.matrix);
    const r = Math.random();
    if (r < 0.35) color.setHex(0x3aaeff);
    else if (r < 0.65) color.setHex(0xff8a30);
    else color.setHSL(Math.random(), 0.7, 0.55);
    colors[i*3] = color.r; colors[i*3+1] = color.g; colors[i*3+2] = color.b;
  }
  crowdGeo.setAttribute('color', new THREE.InstancedBufferAttribute(colors, 3));
  crowdMesh.instanceMatrix.needsUpdate = true;
  scene.add(crowdMesh); worldObjects.push(crowdMesh);

  // Stadium spot lights
  const spotColors = [0xffeecc, 0xccddff, 0xffccdd, 0xddffcc];
  const spotPos = [[-AW*0.8, -AL/3], [AW*0.8, -AL/3], [-AW*0.8, AL/3], [AW*0.8, AL/3]];
  for (let i = 0; i < 4; i++) {
    const [x, z] = spotPos[i];
    const spot = new THREE.SpotLight(spotColors[i], 1.3, 250, Math.PI/3.5, 0.4, 1.2);
    spot.position.set(x, 60, z);
    spot.target.position.set(x*0.2, 0, z*0.2);
    scene.add(spot.target);
    scene.add(spot);
    worldObjects.push(spot); worldObjects.push(spot.target);
  }

  // Skybox with shader (gradient + stars)
  const skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {},
    vertexShader: 'varying vec3 vW; void main(){ vW = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: 'varying vec3 vW; float h(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);} void main(){ vec3 d = normalize(vW); float h2 = d.y*0.5+0.5; vec3 a = vec3(0.02,0.01,0.06); vec3 b = vec3(0.08,0.03,0.18); vec3 c = mix(a,b,h2); vec3 g = floor(d*250.0); float s = h(g); if(s>0.997) c += vec3(0.9,0.95,1.0)*(s-0.997)*400.0; if(s>0.9985) c += vec3(1.0,0.7,0.3)*(s-0.9985)*500.0; gl_FragColor = vec4(c,1.0); }'
  });
  const sky = new THREE.Mesh(new THREE.SphereGeometry(450, 32, 16), skyMat);
  scene.add(sky); worldObjects.push(sky);
}

function buildBoostPads() {
  // Layout inspired by Rocket League
  const layout = [
    // Big pads (100 boost) in corners
    { x: -AW/2 + 10, z: -AL/3, big: true },
    { x:  AW/2 - 10, z: -AL/3, big: true },
    { x: -AW/2 + 10, z:  AL/3, big: true },
    { x:  AW/2 - 10, z:  AL/3, big: true },
    // Small pads (12 boost) — spread across field
    { x: 0, z: -AL/3 - 4, big: false },
    { x: 0, z:  AL/3 + 4, big: false },
    { x: -22, z: -AL/6, big: false },
    { x:  22, z: -AL/6, big: false },
    { x: -22, z:  AL/6, big: false },
    { x:  22, z:  AL/6, big: false },
    { x: -32, z: 0, big: false },
    { x:  32, z: 0, big: false },
    { x: -14, z: -AL/2 + 30, big: false },
    { x:  14, z: -AL/2 + 30, big: false },
    { x: -14, z:  AL/2 - 30, big: false },
    { x:  14, z:  AL/2 - 30, big: false },
    { x: 0, z: -AL/2 + 12, big: false },
    { x: 0, z:  AL/2 - 12, big: false }

  for (const pp of layout) {
    const radius = pp.big ? 2.8 : 1.4;

    // Inner disc
    const disc = new THREE.Mesh(
      new THREE.CircleGeometry(radius * 0.65, 24),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6 })

    disc.rotation.x = -Math.PI/2;

    boostPads.push({
      mesh: ring, disc, light, x: pp.x, z: pp.z, big: pp.big, color,

let ball = null;
function createBall() {
  const mesh = new THREE.Mesh(
    new THREE.SphereGeometry(BR, 28, 28),
    new THREE.MeshStandardMaterial({
      color: 0xffffff, roughness: 0.35, metalness: 0.25,
      emissive: 0xffffff, emissiveIntensity: 0.08
    })
  );
  mesh.castShadow = true;
  scene.add(mesh);
  worldObjects.push(mesh);

  const halo = new THREE.Mesh(
    new THREE.SphereGeometry(BR * 1.45, 14, 14),
    new THREE.MeshBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0.18, side: THREE.BackSide, depthWrite: false })
  );
  mesh.add(halo);

  const trail = [];
  for (let i = 0; i < 10; i++) {
    const t = new THREE.Mesh(
      new THREE.SphereGeometry(BR * 0.85, 10, 10),
      new THREE.MeshBasicMaterial({ color: 0xaaccff, transparent: true, opacity: 0, depthWrite: false })
    );
    t.visible = false;
    scene.add(t);
    trail.push(t);
    worldObjects.push(t);
  }

  ball = {
    mesh, trail, trailIdx: 0,
    vel: new THREE.Vector3(),
    angV: new THREE.Vector3(),
    lastHitter: null,
    reset() {
      this.mesh.position.set(0, BR + 0.5, 0);
      this.vel.set((Math.random()-0.5)*4, 5, (Math.random()-0.5)*4);
      this.angV.set(0, 0, 0);
      this.lastHitter = null;
      this.mesh.visible = true;
      this.trail.forEach(t => t.visible = false);
    }
  };
}

function updateBall(dt) {
  const b = ball;
  b.vel.y += GRAVITY * dt;
  b.mesh.position.addScaledVector(b.vel, dt);
  b.mesh.rotation.x += b.angV.x * dt;
  b.mesh.rotation.z += b.angV.z * dt;
  const p = b.mesh.position;

  if (p.y < BR) {
    p.y = BR;
    if (Math.abs(b.vel.y) > 3) sndKick(Math.min(1, Math.abs(b.vel.y) / 25));
    b.vel.y = Math.abs(b.vel.y) * ELASTICITY;
    b.vel.x *= 0.985; b.vel.z *= 0.985;
    b.angV.set(b.vel.z * 0.3, 0, -b.vel.x * 0.3);
  }
  if (p.y > AH - BR) { p.y = AH - BR; b.vel.y = -Math.abs(b.vel.y) * ELASTICITY; }

  const hw = AW/2 - BR;
  if (p.x > hw) { p.x = hw; b.vel.x = -Math.abs(b.vel.x) * ELASTICITY; sndKick(0.4); }
  if (p.x < -hw) { p.x = -hw; b.vel.x = Math.abs(b.vel.x) * ELASTICITY; sndKick(0.4); }

  const hl = AL/2 - BR;
  const inGX = Math.abs(p.x) < GW/2 - BR;
  const inGY = p.y < GH - BR;
  if (p.z > hl) {
    if (inGX && inGY) { if (!goalScored) onGoal('blue'); }
    else { p.z = hl; b.vel.z = -Math.abs(b.vel.z) * ELASTICITY; sndKick(0.4); }
  }
  if (p.z < -hl) {
    if (inGX && inGY) { if (!goalScored) onGoal('orange'); }
    else { p.z = -hl; b.vel.z = Math.abs(b.vel.z) * ELASTICITY; sndKick(0.4); }
  }

  b.vel.multiplyScalar(0.9995);

  // Speed trail
  const speed = b.vel.length();
  if (speed > 16 && b.mesh.visible) {
    const t = b.trail[b.trailIdx % b.trail.length];
    t.position.copy(p);
    const cHit = b.lastHitter ? (b.lastHitter.isPlayer ? 0x3aaeff : 0xff8a30) : 0xaaccff;
    t.material.color.setHex(cHit);
    t.material.opacity = 0.55;
    t.scale.setScalar(1 - (b.trailIdx % b.trail.length) * 0.07);
    t.visible = true;
    b.trailIdx++;
  }
  b.trail.forEach(t => {
    if (t.visible) {
      t.material.opacity *= 0.88;
      if (t.material.opacity < 0.03) t.visible = false;
    }
  });
}

function createCar(color, isPlayer) {
  const g = new THREE.Group();
  const bodyMat = new THREE.MeshStandardMaterial({
    color, metalness: 0.7, roughness: 0.32,
    emissive: color, emissiveIntensity: 0.18
  });
  const dark = new THREE.MeshStandardMaterial({ color: 0x141414, metalness: 0.85, roughness: 0.3 });

  const body = new THREE.Mesh(new THREE.BoxGeometry(CW, CH, CL), bodyMat);
  body.position.y = CH/2 + 0.05;
  body.castShadow = true;
  g.add(body);

  const hood = new THREE.Mesh(new THREE.BoxGeometry(CW * 0.92, CH * 0.45, CL * 0.4), bodyMat);
  hood.position.set(0, CH * 0.7, CL * 0.28);
  hood.castShadow = true;
  g.add(hood);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(CW * 0.78, CH * 0.6, CL * 0.5), bodyMat);
  cabin.position.set(0, CH * 1.25, -CL * 0.04);
  cabin.castShadow = true;
  g.add(cabin);

  const wsMat = new THREE.MeshStandardMaterial({
    color: 0x001033, transparent: true, opacity: 0.7,
    metalness: 0.9, roughness: 0.1,
    emissive: 0x66bbff, emissiveIntensity: 0.25
  });
  const ws = new THREE.Mesh(new THREE.BoxGeometry(CW * 0.72, CH * 0.45, 0.08), wsMat);
  ws.position.set(0, CH * 1.25, CL * 0.2);
  g.add(ws);

  // Roof stripe glow
  const stripe = new THREE.Mesh(
    new THREE.BoxGeometry(0.45, 0.06, CL * 0.95),
    new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: color, emissiveIntensity: 1.2 })
  );
  stripe.position.set(0, CH + 0.6, 0);
  g.add(stripe);

  // Headlights
  for (const x of [-CW*0.32, CW*0.32]) {
    const hl = new THREE.Mesh(
      new THREE.SphereGeometry(0.22, 10, 10),
      new THREE.MeshBasicMaterial({ color: 0xffffcc })
    );
    hl.position.set(x, CH * 0.65, CL/2 + 0.02);
    g.add(hl);
  }
  // Taillights
  for (const x of [-CW*0.35, CW*0.35]) {
    const tl = new THREE.Mesh(
      new THREE.BoxGeometry(0.5, 0.22, 0.06),
      new THREE.MeshBasicMaterial({ color: 0xff2200 })
    );
    tl.position.set(x, CH * 0.7, -CL/2 - 0.04);
    g.add(tl);
  }

  // Wheels
  const wGeo = new THREE.CylinderGeometry(0.7, 0.7, 0.42, 16);
  const rimGeo = new THREE.CylinderGeometry(0.38, 0.38, 0.44, 8);
  const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.95, roughness: 0.15 });
  const wheelMeshes = [];
  for (const [x, z] of [[-CW/2-0.18, CL/2-0.85],[ CW/2+0.18, CL/2-0.85],[-CW/2-0.18, -CL/2+0.85],[ CW/2+0.18, -CL/2+0.85]]) {
    const w = new THREE.Group();
    const tire = new THREE.Mesh(wGeo, dark);
    tire.rotation.z = Math.PI/2;
    tire.castShadow = true;
    w.add(tire);
    const rim = new THREE.Mesh(rimGeo, rimMat);
    rim.rotation.z = Math.PI/2;
    w.add(rim);
    w.position.set(x, 0.7, z);
    g.add(w);
    wheelMeshes.push(w);
  }

  // Underglow
  const ugMat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.35, depthWrite: false });
  const underglow = new THREE.Mesh(new THREE.PlaneGeometry(CW * 1.6, CL * 1.5), ugMat);
  underglow.rotation.x = -Math.PI/2;
  underglow.position.y = 0.02;
  g.add(underglow);

  // Boost exhaust anchor
  const exhaust = new THREE.Object3D();
  exhaust.position.set(0, CH/2 + 0.1, -CL/2 - 0.3);
  g.add(exhaust);

  // Forward light (headlight cone)
  const carSpot = new THREE.SpotLight(0xffeebb, 0.6, 35, Math.PI/5, 0.5, 1);
  carSpot.position.set(0, CH, CL/2);
  carSpot.target.position.set(0, -0.3, CL/2 + 10);
  g.add(carSpot); g.add(carSpot.target);

  scene.add(g);

  return {
    mesh: g, wheelMeshes, exhaust, color,
    vel: new THREE.Vector3(),
    heading: 0,
    onGround: true,
    boost: 1.0,
    jumpCD: 0,
    canDouble: false,
    isPlayer,
    reset(z, h) {
      this.mesh.position.set(0, 0.7 + CH/2, z);
      this.vel.set(0,0,0);
      this.heading = h;
      this.mesh.rotation.set(0, h, 0);
      this.onGround = true;
      this.jumpCD = 0;
      this.canDouble = false;
      if (this.isPlayer) this.boost = Math.max(this.boost, 0.5);
      else this.boost = 1.0;
    }
  };
}

let playerCar = null;
let aiCar = null;

function updateCar(car, dt, throttle, steer, boosting, jumping) {
  const SPEED = 24, BSPEED = 40;
  const TURN = 2.5, ATURN = 1.8;
  const JUMP = 14.5;
  const FLY = 0.7 + CH/2;

  const turnMult = car.onGround ? TURN : ATURN;
  car.heading += steer * turnMult * dt * (throttle < 0 ? -1 : 1);
  car.mesh.rotation.y = car.heading;

  const fwd = new THREE.Vector3(Math.sin(car.heading), 0, Math.cos(car.heading));
  const top = boosting ? BSPEED : SPEED;

  if (car.onGround) {
    car.vel.x += fwd.x * throttle * top * dt * 6;
    car.vel.z += fwd.z * throttle * top * dt * 6;
    car.vel.x *= 0.88; car.vel.z *= 0.88;
    const s = Math.hypot(car.vel.x, car.vel.z);
    if (s > top) { car.vel.x = car.vel.x/s*top; car.vel.z = car.vel.z/s*top; }
  } else {
    car.vel.x += fwd.x * throttle * 10 * dt;
    car.vel.z += fwd.z * throttle * 10 * dt;
  }

  if (jumping && car.jumpCD <= 0) {
    if (car.onGround) {
      car.vel.y = JUMP;
      car.onGround = false;
      car.canDouble = true;
      car.jumpCD = 0.25;
      if (car.isPlayer) sndJump();
    } else if (car.canDouble) {
      car.vel.y = JUMP * 0.85;
      car.canDouble = false;
      car.jumpCD = 1.0;
      if (car.isPlayer) sndJump();
    }
  }
  car.jumpCD = Math.max(0, car.jumpCD - dt);

  car.vel.y += GRAVITY * dt;
  if (boosting && !car.onGround) car.vel.y += 16 * dt;

  car.mesh.position.addScaledVector(car.vel, dt);
  const p = car.mesh.position;

  if (p.y < FLY) {
    p.y = FLY;
    car.vel.y = car.vel.y < -4 ? -car.vel.y * 0.2 : 0;
    car.onGround = true;
  } else if (p.y > FLY + 0.2) {
    car.onGround = false;
  }
  if (p.y > AH - CH) { p.y = AH - CH; car.vel.y = -Math.abs(car.vel.y) * 0.3; }
  const hw = AW/2 - CW/2;
  if (p.x > hw) { p.x = hw; car.vel.x = -Math.abs(car.vel.x) * 0.4; }
  if (p.x < -hw) { p.x = -hw; car.vel.x = Math.abs(car.vel.x) * 0.4; }
  const hl = AL/2 - CL/2;
  if (p.z > hl) { p.z = hl; car.vel.z = -Math.abs(car.vel.z) * 0.4; }
  if (p.z < -hl) { p.z = -hl; car.vel.z = Math.abs(car.vel.z) * 0.4; }

  const tilt = car.onGround ? 0 : car.vel.y * 0.022;
  car.mesh.rotation.x += (tilt - car.mesh.rotation.x) * 0.13;

  const gs = Math.hypot(car.vel.x, car.vel.z);
  car.wheelMeshes.forEach(w => w.rotation.x += gs * dt * 2.5);

  // Boost flame particles
  if (boosting && car.boost > 0.01) {
    const wp = new THREE.Vector3();
    car.exhaust.getWorldPosition(wp);
    for (let i = 0; i < 3; i++) {
      const sx = (Math.random()-0.5) * 0.5;
      const sy = (Math.random()-0.5) * 0.4;
      const c = Math.random() < 0.4 ? 0xff3300 : (Math.random() < 0.6 ? 0xff8800 : 0xffdd00);
      spawnParticle(
        wp.x + sx, wp.y + sy, wp.z,
        -fwd.x * (8 + Math.random()*6) + (Math.random()-0.5)*2,
        Math.random()*2 - 1,
        -fwd.z * (8 + Math.random()*6) + (Math.random()-0.5)*2,
        c, 0.45 + Math.random()*0.4, 0.35, false
      );
    }
  }

  // Tire smoke when drifting
  if (car.onGround && Math.abs(steer) > 0.7 && gs > 14) {
    for (let i = 0; i < 2; i++) {
      const wm = car.wheelMeshes[i + 2];
      const wp = new THREE.Vector3();
      wm.getWorldPosition(wp);
      spawnParticle(wp.x, wp.y, wp.z,
        (Math.random()-0.5)*3, Math.random()*2.5, (Math.random()-0.5)*3,
        0xcccccc, 0.6, 0.5, false);
    }
  }
}

function carBallCollision(car, b) {
  if (!b.mesh.visible) return;
  const cp = car.mesh.position;
  const bp = b.mesh.position;
  const dx = bp.x - cp.x;
  const dy = bp.y - (cp.y + CH*0.25);
  const dz = bp.z - cp.z;
  const dist = Math.sqrt(dx*dx + dy*dy + dz*dz);
  const minD = BR + Math.max(CW, CL) * 0.55;
  if (dist < minD && dist > 0.01) {
    const nx = dx/dist, ny = dy/dist, nz = dz/dist;
    const overlap = minD - dist;
    bp.x += nx*overlap; bp.y += ny*overlap; bp.z += nz*overlap;
    const rvx = car.vel.x - b.vel.x;
    const rvy = car.vel.y - b.vel.y;
    const rvz = car.vel.z - b.vel.z;
    const dot = rvx*nx + rvy*ny + rvz*nz;
    if (dot > 0) {
      const imp = dot * 1.9;
      b.vel.x += nx*imp; b.vel.y += ny*imp + 2.5; b.vel.z += nz*imp;
      const spd = b.vel.length();
      if (spd > 55) b.vel.multiplyScalar(55/spd);
      b.lastHitter = car;
      sndKick(Math.min(1, dot/15));
      burst(bp.x - nx*BR, bp.y - ny*BR, bp.z - nz*BR, 0xffffaa, 8, 5);
    }
  }
}

function checkBoostPads(car, dt) {
  const cp = car.mesh.position;
  for (const pad of boostPads) {
    if (!pad.active) {
      pad.respawnT -= dt;
      if (pad.respawnT <= 0) {
        pad.active = true;
        pad.mesh.visible = true;
        pad.disc.visible = true;
        pad.light.intensity = pad.big ? 1.2 : 0.6;
      }
      continue;
    }
    const pulse = 1 + Math.sin(performance.now() * 0.005 + pad.x * 0.1) * 0.15;
    pad.mesh.scale.set(1, pulse, 1);
    pad.mesh.rotation.y += dt * 0.8;
    pad.disc.rotation.z += dt * 1.2;

    if (cp.y < 4) {
      const dx = cp.x - pad.x, dz = cp.z - pad.z;
      const r = pad.big ? 3.3 : 2;
      if (dx*dx + dz*dz < r*r) {
        pad.active = false;
        pad.mesh.visible = false;
        pad.disc.visible = false;
        pad.light.intensity = 0;
        pad.respawnT = pad.big ? 10 : 4;
        car.boost = Math.min(1, car.boost + (pad.big ? 1.0 : 0.12));
        if (car.isPlayer) sndPickup(pad.big);
        burst(pad.x, 0.5, pad.z, pad.color, 18, 7);
      }
    }
  }
}

// AI
// ===========================================================
function aiInput(car) {
  const p = car.mesh.position;
  const bp = ball.mesh.position;
  const bv = ball.vel;
  const predict = bp.clone().addScaledVector(bv, 0.45);
  const ownGoal = new THREE.Vector3(0, 0, -AL/2);
  const dist = p.distanceTo(bp);

  let target;
  if (dist < 18) {
    const ballToGoal = ownGoal.clone().sub(bp).normalize();
    target = bp.clone().sub(ballToGoal.multiplyScalar(3.2));
  } else {
    target = predict;
  }

  const toT = target.clone().sub(p);
  toT.y = 0;
  const tAng = Math.atan2(toT.x, toT.z);
  let diff = tAng - car.heading;
  while (diff > Math.PI) diff -= Math.PI*2;
  while (diff < -Math.PI) diff += Math.PI*2;

  const steer = Math.max(-1, Math.min(1, diff * 2.8));
  const boosting = dist < 28 && car.onGround && Math.abs(diff) < 0.45;
  const jumping = dist < 7 && Math.abs(p.y - (0.7 + CH/2)) < 1.6 && bp.y > 2;

  car.boost = 1.0;
  return { throttle: 1, steer, boosting, jumping };
}

  camShake = 0;

function onGoal(scorer) {
  if (goalScored) return;
  goalScored = true;
  goalTimer = 3.5;
  camShake = 2.0;

  const bp = ball.mesh.position.clone();
  const explosionColor = scorer === 'orange' ? 0x3aaeff : 0xff8a30;

  // MASSIVE EXPLOSION
  burst(bp.x, bp.y, bp.z, explosionColor, 100, 28);
  burst(bp.x, bp.y, bp.z, 0xffff00, 60, 22);
  burst(bp.x, bp.y, bp.z, 0xffffff, 40, 18);

  // Secondary bursts
  for (let i = 1; i <= 3; i++) {
    setTimeout(() => {
      burst(bp.x + (Math.random()-0.5)*8, bp.y + Math.random()*4, bp.z + (Math.random()-0.5)*8, explosionColor, 50, 15);
      burst(bp.x + (Math.random()-0.5)*8, bp.y + Math.random()*4, bp.z + (Math.random()-0.5)*8, 0xffaa00, 30, 12);
      camShake = Math.max(camShake, 1.4);
    }, i * 150);
  }

  ball.mesh.visible = false;
  ball.trail.forEach(t => t.visible = false);

  if (scorer === 'orange') {
    blueScore++;
    showGoal('¡GOOOL!', '#3aaeff');
  } else {
    orangeScore++;
    showGoal('¡GOOOL!', '#ff8a30');
  }
  flashScreen(explosionColor);
  sndGoal();
  updateScoreboard();
}

function showGoal(text, color) {
  const el = document.getElementById('goalAnnounce');
  el.textContent = text;
  el.style.color = color;
  el.style.opacity = '1';
  el.style.transform = 'translate(-50%, -50%) scale(1)';
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translate(-50%, -50%) scale(0.4)';
  }, 2300);
}

function flashScreen(colorHex) {
  const f = document.getElementById('flash');
  f.style.background = '#' + colorHex.toString(16).padStart(6, '0');
  f.style.opacity = '0.85';
  setTimeout(() => { f.style.opacity = '0'; }, 220);
}

function updateScoreboard() {
  document.getElementById('blueScore').textContent = blueScore;
  document.getElementById('orangeScore').textContent = orangeScore;
}

function updateTimer(dt) {
  gameTime = Math.max(0, gameTime - dt);
  const m = Math.floor(gameTime/60);
  const s = Math.floor(gameTime%60).toString().padStart(2,'0');
  document.getElementById('timerEl').textContent = m + ':' + s;
  if (gameTime <= 0) endGame();
}

function endGame() {
  gameRunning = false;
  const winner = blueScore > orangeScore ? '¡VICTORIA! 🔵'
              : blueScore < orangeScore ? 'DERROTA 🟠'
              : '¡EMPATE!';
  const ov = document.getElementById('overlay');
  ov.innerHTML = '<h1>FIN DE PARTIDA</h1>' +
    '<div class="subtitle" style="font-size:28px;color:#fff;margin-bottom:12px;font-weight:900">' + winner + '</div>' +
    '<div class="subtitle" style="font-size:52px;font-weight:900;margin-bottom:24px"><span class="b">' + blueScore + '</span> - <span class="o">' + orangeScore + '</span></div>' +
    '<button class="play-btn" onclick="startGame()">JUGAR DE NUEVO</button>';
  ov.style.display = 'flex';
}

function updateCamera(dt) {
  if (!playerCar) return;
  const cp = playerCar.mesh.position;
  const bp = ball.mesh.position;

  let tx, ty, tz, lx, ly, lz;

  if (goalScored) {
    // Orbiting goal cam
    const orbitT = (3.5 - goalTimer) * 0.6;
    tx = bp.x + Math.sin(orbitT) * 28;
    ty = 14 + Math.sin(orbitT * 0.5) * 4;
    tz = bp.z + Math.cos(orbitT) * 28;
    lx = bp.x; ly = bp.y; lz = bp.z;
  } else {
    let dx, dz;
    if (ballCam) {
      dx = cp.x - bp.x;
      dz = cp.z - bp.z;
      const d = Math.sqrt(dx*dx + dz*dz);
      if (d < 5) { dx = -Math.sin(playerCar.heading); dz = -Math.cos(playerCar.heading); }
      else { dx /= d; dz /= d; }
    } else {
      dx = -Math.sin(playerCar.heading);
      dz = -Math.cos(playerCar.heading);
    }
    const camDist = 19, camHeight = 8.5;
    tx = cp.x + dx * camDist;
    ty = cp.y + camHeight;
    tz = cp.z + dz * camDist;
    lx = bp.x;
    ly = Math.max(bp.y + 2, 3);
    lz = bp.z;
    if (!ballCam) { lx = cp.x; ly = cp.y + 1.5; lz = cp.z; }
  }

  camPos.x += (tx - camPos.x) * (goalScored ? 0.05 : 0.1);
  camPos.y += (ty - camPos.y) * (goalScored ? 0.05 : 0.1);
  camPos.z += (tz - camPos.z) * (goalScored ? 0.05 : 0.1);
  camLook.x += (lx - camLook.x) * 0.15;
  camLook.y += (ly - camLook.y) * 0.15;
  camLook.z += (lz - camLook.z) * 0.15;

  camera.position.copy(camPos);
  if (camShake > 0.01) {
    camera.position.x += (Math.random()-0.5) * camShake;
    camera.position.y += (Math.random()-0.5) * camShake;
    camera.position.z += (Math.random()-0.5) * camShake;
    camShake *= 0.91;
  }
  camera.lookAt(camLook);
}

// ===========================================================
// CONTROLS
// ===========================================================
const joyZone = document.getElementById('joystickZone');
const joyThumb = document.getElementById('joystickThumb');
let joyId = null, joyOX = 85, joyOY = 85;
const JR = 52;

joyZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joyId = t.identifier;
  const r = joyZone.getBoundingClientRect();
  joyOX = t.clientX - r.left;
  joyOY = t.clientY - r.top;
}, { passive: false });

document.addEventListener('touchmove', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyId) continue;
    e.preventDefault();
    const r = joyZone.getBoundingClientRect();
    let dx = (t.clientX - r.left) - joyOX;
    let dy = (t.clientY - r.top) - joyOY;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (d > JR) { dx = dx/d*JR; dy = dy/d*JR; }
    input.joyX = dx/JR; input.joyY = dy/JR;
    joyThumb.style.left = (joyOX - 35 + dx) + 'px';
    joyThumb.style.top = (joyOY - 35 + dy) + 'px';
  }
}, { passive: false });

document.addEventListener('touchend', e => {
  for (const t of e.changedTouches) {
    if (t.identifier !== joyId) continue;
    joyId = null; input.joyX = 0; input.joyY = 0;
    joyThumb.style.left = '50px'; joyThumb.style.top = '50px';
  }
});

const boostBtn = document.getElementById('boostBtn');
boostBtn.addEventListener('touchstart', e => { e.preventDefault(); input.boost = true; }, { passive: false });
boostBtn.addEventListener('touchend', e => { e.preventDefault(); input.boost = false; }, { passive: false });
boostBtn.addEventListener('touchcancel', e => { e.preventDefault(); input.boost = false; }, { passive: false });

const jumpBtn = document.getElementById('jumpBtn');
jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); input.jumpPressed = true; }, { passive: false });
jumpBtn.addEventListener('touchend', e => { e.preventDefault(); }, { passive: false });

const camBtn = document.getElementById('camBtn');
function toggleCam() {
  ballCam = !ballCam;
  camBtn.style.borderColor = ballCam ? '#3aaeff' : 'rgba(255,255,255,0.4)';
  camBtn.style.boxShadow = ballCam ? '0 0 20px rgba(58,174,255,0.5)' : 'none';
}
camBtn.addEventListener('click', e => { e.preventDefault(); toggleCam(); });
camBtn.addEventListener('touchstart', e => { e.preventDefault(); toggleCam(); }, { passive: false });
camBtn.style.borderColor = '#3aaeff';
camBtn.style.boxShadow = '0 0 20px rgba(58,174,255,0.5)';

const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') { input.jumpPressed = true; e.preventDefault(); }
  if (e.code === 'KeyC') toggleCam();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

// ===========================================================
// MAIN LOOP
// ===========================================================
let lastT = 0;
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min((now - lastT) / 1000, 0.05);
  lastT = now;

  if (gameRunning && dt > 0) {
    if (goalScored) {
      goalTimer -= dt;
      if (goalTimer <= 0) {
        ball.mesh.visible = true;
        resetRound();
      }
      updateParticles(dt);
    } else {
      let thr = 0, str = 0;
      let boost = input.boost;
      let jump = input.jumpPressed;
      input.jumpPressed = false;

      if (Math.abs(input.joyX) > 0.05 || Math.abs(input.joyY) > 0.05) {
        thr = -input.joyY; str = input.joyX;
      }
      if (keys['ArrowUp'] || keys['KeyW']) thr = 1;
      if (keys['ArrowDown'] || keys['KeyS']) thr = -0.5;
      if (keys['ArrowLeft'] || keys['KeyA']) str = -1;
      if (keys['ArrowRight'] || keys['KeyD']) str = 1;
      if (keys['ShiftLeft']) boost = true;

      if (boost && playerCar.boost > 0) {
        playerCar.boost = Math.max(0, playerCar.boost - dt * 0.4);
      } else if (playerCar.boost <= 0) {
        boost = false;
      }
      const pct = Math.round(playerCar.boost * 100);
      document.getElementById('boostFill').style.height = pct + '%';
      document.getElementById('boostText').textContent = pct;

      updateCar(playerCar, dt, thr, str, boost, jump);
      const ai = aiInput(aiCar);
      updateCar(aiCar, dt, ai.throttle, ai.steer, ai.boosting, ai.jumping);
      updateBall(dt);
      carBallCollision(playerCar, ball);
      carBallCollision(aiCar, ball);
      checkBoostPads(playerCar, dt);
      checkBoostPads(aiCar, dt);
      updateParticles(dt);
      updateTimer(dt);
    }
    updateCamera(dt);
  } else {
    updateParticles(dt);
  }

  renderer.render(scene, camera);
}

// Intro view
scene.add(ambLight);
scene.add(keyLight);
camera.position.set(0, 30, -55);
camera.lookAt(0, 0, 0);
requestAnimationFrame(loop);
</script>
